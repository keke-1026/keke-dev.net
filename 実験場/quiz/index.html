<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Main Display</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- Google Fonts Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

    <style>
        :root {
            --primary-color: #333333;
            --accent-color: #d32f2f;
            --bg-color: #ffffff;
            --surface-color: #f5f5f5;
            --border-color: #e0e0e0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--primary-color);
            font-family: 'Noto Sans JP', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* ロゴ部分 */
        header {
            width: 100%;
            padding: 20px 0;
            text-align: center;
            border-bottom: 2px solid var(--border-color);
        }

        header h1 {
            margin: 0;
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 2px;
        }

        /* メインコンテンツエリア */
        main {
            flex: 1;
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }

        /* エントリー画面 (名前入力とボタン割り当て) */
        #entry-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
        }

        .player-entry {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            align-items: center;
        }

        .player-entry input {
            padding: 10px;
            font-size: 1.2rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-family: 'Noto Sans JP', sans-serif;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 5px 10px;
            background-color: var(--surface-color);
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        /* 出題・クイズ進行画面 (初期は非表示) */
        #quiz-section {
            display: none;
            flex-direction: column;
            flex: 1;
        }

        .question-box {
            background-color: var(--surface-color);
            padding: 40px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 40px;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .question-text {
            font-size: 2rem;
            font-weight: 700;
            margin: 0;
        }

        /* プレイヤーごとの早押し状態表示 */
        .players-container {
            display: flex;
            justify-content: space-around;
            width: 100%;
        }

        .player-card {
            background-color: var(--bg-color);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            width: 20%;
            transition: all 0.2s ease;
        }

        .player-card.active {
            border-color: var(--accent-color);
            background-color: #fff0f0;
            transform: scale(1.05);
        }

        .player-name {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .push-time {
            font-size: 1.2rem;
            color: var(--accent-color);
            font-family: monospace;
            height: 24px;
        }

        /* ガイダンス表示 */
        .guidance {
            text-align: center;
            margin-top: auto;
            padding: 20px;
            color: #666;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
    </style>
</head>
<body>

    <!-- 音楽・効果音のプレースホルダー -->
    <audio id="bgm" src="bgm-placeholder.mp3" loop></audio>
    <audio id="se-push" src="push-placeholder.mp3"></audio>
    <audio id="se-correct" src="correct-placeholder.mp3"></audio>

    <header>
        <h1>QUIZ TOURNAMENT</h1>
    </header>

    <main>
        <!-- エントリー画面 -->
        <section id="entry-section">
            <h2>参加者エントリー</h2>
            <div id="entry-list">
                <!-- JavaScriptでプレイヤー入力欄を生成 -->
            </div>
            <div class="guidance">
                <span class="material-symbols-outlined">keyboard</span>
                <span>名前を入力し、アーケードボタンを押してプレイヤー枠を確定してください。全員確定後、Enterキーで開始します。</span>
            </div>
        </section>

        <!-- クイズ進行画面 -->
        <section id="quiz-section">
            <div class="question-box">
                <p class="question-text" id="display-question">ここに問題文が表示されます</p>
            </div>
            
            <div class="players-container" id="players-board">
                <!-- JavaScriptでプレイヤーの早押しランプを生成 -->
            </div>
        </section>
    </main>

    <!-- 制御用スクリプト -->
    <!-- FirebaseのSDK読み込み (本実装時に追加) -->
    <script type="module">
        // 本実装時はここでFirebase Firestoreをインポートし、onSnapshotで別画面からの出題や正誤判定を監視します。

        // --- 状態管理 ---
        let currentPhase = 'entry'; // 'entry' | 'standby' | 'question' | 'judging'
        let questionStartTime = 0;
        const players = [
            { id: 1, name: "", keyAssigned: null, pushTime: null },
            { id: 2, name: "", keyAssigned: null, pushTime: null },
            { id: 3, name: "", keyAssigned: null, pushTime: null },
            { id: 4, name: "", keyAssigned: null, pushTime: null }
        ];

        // --- UI初期化 (エントリー画面) ---
        const entryList = document.getElementById('entry-list');
        players.forEach(p => {
            const div = document.createElement('div');
            div.className = 'player-entry';
            div.innerHTML = `
                <span class="status-badge">Player ${p.id}</span>
                <input type="text" id="name-${p.id}" placeholder="名前を入力">
                <span class="material-symbols-outlined" id="status-icon-${p.id}" style="color: #ccc;">gamepad</span>
                <span id="key-display-${p.id}" style="font-size: 0.9rem; color: #666;">ボタン未割り当て</span>
            `;
            entryList.appendChild(div);
        });

        // --- イベントリスナー (キーボード / アーケードボタン) ---
        document.addEventListener('keydown', (e) => {
            // Enterキーで画面切り替え (エントリー完了 -> スタート)
            if (e.key === 'Enter' && currentPhase === 'entry') {
                startQuiz();
                return;
            }

            // エントリーフェーズ: ボタンの割り当て
            if (currentPhase === 'entry' && e.key !== 'Enter' && e.key !== 'Tab') {
                assignButtonToPlayer(e.key);
                return;
            }

            // クイズフェーズ: 早押し判定
            if (currentPhase === 'question') {
                handlePush(e.key);
            }
        });

        // --- 関数群 ---

        // ボタンの割り当て処理
        function assignButtonToPlayer(pressedKey) {
            // 既に割り当て済みのキーかチェック
            if (players.some(p => p.keyAssigned === pressedKey)) return;

            // 未割り当てのプレイヤー枠を探す
            const targetPlayer = players.find(p => p.keyAssigned === null);
            if (targetPlayer) {
                targetPlayer.keyAssigned = pressedKey;
                document.getElementById(`status-icon-${targetPlayer.id}`).style.color = '#4CAF50';
                document.getElementById(`key-display-${targetPlayer.id}`).innerText = '割り当て完了';
            }
        }

        // クイズ画面への移行
        function startQuiz() {
            // 名前を保存
            players.forEach(p => {
                const nameInput = document.getElementById(`name-${p.id}`).value;
                p.name = nameInput || `Player ${p.id}`;
            });

            document.getElementById('entry-section').style.display = 'none';
            document.getElementById('quiz-section').style.display = 'flex';
            
            // BGM再生開始 (ユーザー操作直後なので再生可能)
            // document.getElementById('bgm').play().catch(e => console.log("BGM Play Error:", e));

            currentPhase = 'standby';
            renderPlayersBoard();
            
            // 本実装時: Firestoreに出題待機ステータスを書き込む
        }

        // クイズボードの描画
        function renderPlayersBoard() {
            const board = document.getElementById('players-board');
            board.innerHTML = '';
            players.forEach(p => {
                board.innerHTML += `
                    <div class="player-card" id="card-${p.id}">
                        <div class="player-name">${p.name}</div>
                        <div class="push-time" id="time-${p.id}">--.---</div>
                    </div>
                `;
            });
        }

        // 問題出題 (別サイトのFirestore更新を検知して発火する想定)
        function triggerQuestion(questionText) {
            currentPhase = 'question';
            document.getElementById('display-question').innerText = questionText;
            
            // ミリ秒単位の高精度タイマーの開始時間を記録
            questionStartTime = performance.now(); 
        }

        // 早押し時の処理
        function handlePush(pressedKey) {
            const player = players.find(p => p.keyAssigned === pressedKey);
            if (player) {
                // 問題表示から押されるまでの時間をミリ秒単位で正確に取得
                const pushTimeMs = performance.now() - questionStartTime;
                
                currentPhase = 'judging'; // 他の入力をブロック
                
                // SE再生とBGM停止
                // document.getElementById('se-push').play();
                // document.getElementById('bgm').pause();

                // UI反映
                document.getElementById(`card-${player.id}`).classList.add('active');
                document.getElementById(`time-${player.id}`).innerText = (pushTimeMs / 1000).toFixed(3) + '秒';

                // 本実装時: Firestoreに「誰が何秒で押したか」を送信し、別サイト側へ判定を委ねる
            }
        }

        // デバッグ用: 5秒後に出題のシミュレーション
        // setTimeout(() => { if(currentPhase === 'standby') triggerQuestion("日本で一番高い山は？"); }, 5000);

    </script>
</body>
</html>
