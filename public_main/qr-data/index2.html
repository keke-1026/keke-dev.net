<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-Speed QR Receiver</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #ffffff;
            color: #333333;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        video {
            width: 100%;
            max-width: 400px;
            background-color: #eeeeee;
            border: 2px solid #333;
            border-radius: 4px;
        }
        canvas {
            display: none;
        }
        #progress {
            font-size: 20px;
            font-weight: bold;
            color: #d32f2f;
            margin: 15px 0;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            min-height: 100px;
            word-break: break-all;
            text-align: left;
            background-color: #fafafa;
        }
    </style>
    <!-- jsQRライブラリの読み込み -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>受信機 (Receiver)</h1>
        
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
        
        <div id="progress">カメラを起動しています...</div>
        
        <h2>受信データ:</h2>
        <div id="result">ここに復元されたテキストが表示されます</div>
    </div>

    <script>
        const video = document.getElementById("video");
        const canvasElement = document.getElementById("canvas");
        const canvas = canvasElement.getContext("2d", { willReadFrequently: true });
        const progressDiv = document.getElementById("progress");
        
        let receivedChunks = {};
        let totalChunks = 0;
        let isCompleted = false;

        // カメラ起動の初期化処理
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" } 
                });
                video.srcObject = stream;
                
                // ビデオのメタデータが読み込まれてから再生を開始
                video.onloadedmetadata = () => {
                    video.play().then(() => {
                        progressDiv.innerText = "スキャン待機中...";
                        requestAnimationFrame(tick);
                    }).catch(err => {
                        progressDiv.innerText = "ビデオ再生エラー: " + err.message;
                    });
                };
            } catch (err) {
                console.error(err);
                progressDiv.innerText = "カメラの許可または起動に失敗しました: " + err.message;
            }
        }

        function tick() {
            if (isCompleted) return;

            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvasElement.height = video.videoHeight;
                canvasElement.width = video.videoWidth;
                canvas.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);
                
                const imageData = canvas.getImageData(0, 0, canvasElement.width, canvasElement.height);
                
                const code = jsQR(imageData.data, imageData.width, imageData.height, {
                    inversionAttempts: "dontInvert",
                });

                if (code) {
                    const match = code.data.match(/^(\d+)\/(\d+):([\s\S]*)$/);
                    if (match) {
                        const total = parseInt(match[1], 10);
                        const index = parseInt(match[2], 10);
                        const dataChunk = match[3];

                        totalChunks = total;
                        
                        if (!receivedChunks[index]) {
                            receivedChunks[index] = dataChunk;
                        }

                        const currentCount = Object.keys(receivedChunks).length;
                        progressDiv.innerText = `受信中... ${currentCount} / ${totalChunks}`;

                        if (currentCount === totalChunks) {
                            isCompleted = true;
                            progressDiv.innerText = "受信完了！";
                            progressDiv.style.color = "#1a73e8";
                            
                            let finalData = "";
                            for (let i = 0; i < totalChunks; i++) {
                                finalData += receivedChunks[i] || "";
                            }
                            document.getElementById("result").innerText = finalData;
                        }
                    }
                }
            }
            requestAnimationFrame(tick);
        }

        // ページ読み込み後にカメラ起動を実行
        window.addEventListener('load', initCamera);
    </script>
</body>
</html>
