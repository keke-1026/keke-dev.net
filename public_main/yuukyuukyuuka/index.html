<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>有給休暇タイピング</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background-color: #ffffff;
            color: #333333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            user-select: none;
        }

        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            max-width: 600px;
        }

        .title-section {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: #333333;
        }

        #time-display {
            font-size: 1.2rem;
            color: #666666;
            margin-bottom: 2rem;
        }

        #timer {
            font-size: 2.5rem;
            font-weight: 700;
            color: #333333;
        }

        #target-display {
            text-align: center;
            margin-bottom: 2rem;
            height: 120px;
        }

        #kanji {
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 0.2rem;
            letter-spacing: 0.3rem;
            color: #333333;
        }

        #romaji {
            font-size: 2rem;
            letter-spacing: 0.1rem;
            color: rgba(51, 51, 51, 0.4);
        }

        .typed {
            color: #333333;
            display: inline-block;
        }

        /* 入力時のポップアニメーション */
        .pop-animation {
            animation: pop 0.2s ease-out;
        }

        @keyframes pop {
            0% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-5px) scale(1.1); }
            100% { transform: translateY(0) scale(1); }
        }

        #message {
            font-size: 1.2rem;
            color: #888888;
            height: 1.5rem;
            margin-bottom: 1rem;
        }

        /* クリア時のリザルト */
        #results-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 2rem;
        }

        #rank-display {
            font-size: 2rem;
            font-weight: 700;
            color: #333333;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .rank-char {
            font-size: 6rem;
            line-height: 1;
            color: #333333;
        }

        /* ランク表示時の拡大アニメーション */
        .rank-animate {
            animation: rankPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
        }

        @keyframes rankPop {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        #rank-msg {
            font-size: 1.5rem;
            color: #333333;
            margin-bottom: 1.5rem;
        }

        /* まるっこい登録フォーム */
        #registration-form {
            display: flex;
            gap: 10px;
            margin-bottom: 1.5rem;
        }
        #registration-form input {
            padding: 10px 20px;
            font-size: 1rem;
            border: 2px solid #dddddd;
            border-radius: 30px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        #registration-form input:focus {
            border-color: #333333;
        }
        #registration-form button {
            padding: 10px 24px;
            font-size: 1rem;
            font-weight: 700;
            border: none;
            border-radius: 30px;
            background-color: #333333;
            color: #ffffff;
            cursor: pointer;
            font-family: inherit;
            transition: background-color 0.2s, transform 0.1s;
        }
        #registration-form button:hover {
            background-color: #555555;
        }
        #registration-form button:active {
            transform: scale(0.95);
        }

        /* まるっこいリスタートガイド */
        #restart-guide {
            font-size: 1.2rem;
            font-weight: 700;
            color: #333333;
            border: 2px solid #333333;
            padding: 10px 30px;
            border-radius: 30px;
            background-color: #f9f9f9;
        }

        /* ランキング */
        #ranking-section {
            width: 100%;
            max-width: 400px;
            border-top: 2px dashed #eeeeee;
            padding-top: 1.5rem;
            margin-top: 1rem;
        }
        
        .ranking-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .ranking-list {
            list-style: none;
            padding: 0;
            margin: 0;
            text-align: left;
        }

        .ranking-item {
            display: flex;
            justify-content: space-between;
            padding: 0.8rem 1rem;
            margin-bottom: 0.5rem;
            background-color: #f9f9f9;
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: 700;
        }

        .hidden {
            display: none !important;
        }

        .miss-animation {
            animation: shake 0.3s;
            color: #ff4444 !important;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div class="title-section">有給休暇タイピング</div>
        <div id="time-display">準備運動<br><span id="timer">0.000s</span></div>
        
        <div id="target-display">
            <div id="kanji">有給休暇</div>
            <div id="romaji">yuukyuukyuuka</div>
        </div>
        
        <div id="message">yをタイプしてスタート</div>
        
        <div id="results-display" class="hidden">
            <div id="rank-display">ランク <span class="rank-char">S</span></div>
            <div id="rank-msg">完璧です！</div>
            
            <div id="registration-form">
                <input type="text" id="player-name" placeholder="名前を入力" maxlength="10">
                <button id="submit-score">記録を登録</button>
            </div>
            
            <div id="restart-guide">yキーを押してリスタート</div>
        </div>

        <div id="ranking-section">
            <div class="ranking-title">ランキング</div>
            <ul id="ranking-list" class="ranking-list">
                <li class="ranking-item"><span>読み込み中...</span></li>
            </ul>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, limit, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBjQWOa8y2UWgL81HvmEv_yiTCtTbk4cxU",
            authDomain: "keke-dev.firebaseapp.com",
            databaseURL: "https://keke-dev-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "keke-dev",
            storageBucket: "keke-dev.firebasestorage.app",
            messagingSenderId: "131535510066",
            appId: "1:131535510066:web:8f8b7fac5aef71aca23a2b",
            measurementId: "G-EGS7LE2Z44"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const rankSettings = [
            { maxTime: 0.5, rank: "SSS+", message: "神!有給休暇1年あげます" },    
            { maxTime: 0.8, rank: "S", message: "有給休暇半年ゲット!" },
            { maxTime: 1.0, rank: "A", message: "有給休暇7日上げます" },
            { maxTime: 1.3, rank: "B", message: "有給休暇までもうすこし" },
            { maxTime: 1.7, rank: "C", message: "もっと仕事しましょう" },
            { maxTime: Infinity, rank: "D", message: "クビ｡" }
        ];

        const targetWord = "yuukyuukyuuka";
        let currentIndex = 0;
        let startTime;
        let timerInterval;
        let isCleared = false;
        let finalTime = 0;

        const romajiEl = document.getElementById('romaji');
        const timerEl = document.getElementById('timer');
        const messageEl = document.getElementById('message');
        const kanjiEl = document.getElementById('kanji');
        const targetEl = document.getElementById('target-display');
        const resultsEl = document.getElementById('results-display');
        const rankCharEl = document.querySelector('.rank-char');
        const rankMsgEl = document.getElementById('rank-msg');
        const registrationForm = document.getElementById('registration-form');
        const rankingListEl = document.getElementById('ranking-list');

        async function loadRankings() {
            try {
                const q = query(collection(db, "rankings"), orderBy("time"), limit(5));
                const querySnapshot = await getDocs(q);
                rankingListEl.innerHTML = '';
                
                if (querySnapshot.empty) {
                    rankingListEl.innerHTML = '<li class="ranking-item"><span>まだ記録がありません</span></li>';
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const li = document.createElement('li');
                    li.className = 'ranking-item';
                    li.innerHTML = `<span>${data.name || '名無し'}</span><span>${data.time.toFixed(3)}s</span>`;
                    rankingListEl.appendChild(li);
                });
            } catch (e) {
                console.error("Error loading rankings: ", e);
                rankingListEl.innerHTML = '<li class="ranking-item"><span>ランキングの読み込みに失敗しました</span></li>';
            }
        }

        loadRankings();

        function getRank(time) {
            for (const setting of rankSettings) {
                if (time <= setting.maxTime) {
                    return setting;
                }
            }
            return rankSettings[rankSettings.length - 1];
        }

        function updateRomajiDisplay(isTypeHit = false) {
            let html = '';
            for (let i = 0; i < targetWord.length; i++) {
                if (i < currentIndex) {
                    if (isTypeHit && i === currentIndex - 1) {
                        html += `<span class="typed pop-animation">${targetWord[i]}</span>`;
                    } else {
                        html += `<span class="typed">${targetWord[i]}</span>`;
                    }
                } else {
                    html += targetWord[i];
                }
            }
            romajiEl.innerHTML = html;
        }

        function resetGame(isMiss) {
            clearInterval(timerInterval);
            currentIndex = 0;
            isCleared = false;
            updateRomajiDisplay();
            
            targetEl.classList.remove('hidden');
            resultsEl.classList.add('hidden');
            
            if (isMiss) {
                messageEl.textContent = "ミス！ 最初から";
                kanjiEl.classList.add('miss-animation');
                setTimeout(() => {
                    kanjiEl.classList.remove('miss-animation');
                }, 300);
            } else {
                messageEl.textContent = "yをタイプしてスタート";
            }
            
            timerEl.textContent = "0.000s";
        }

        function updateTimer() {
            const currentTime = performance.now();
            const elapsedTime = ((currentTime - startTime) / 1000).toFixed(3);
            timerEl.textContent = `${elapsedTime}s`;
        }

        window.addEventListener('keydown', (e) => {
            if (document.activeElement.tagName === 'INPUT') {
                return;
            }

            if (isCleared) {
                if (e.key === 'y') {
                    resetGame(false);
                }
                return;
            }

            if (e.key === targetWord[currentIndex]) {
                // ここでSEを再生（正解）
                
                if (currentIndex === 0) {
                    messageEl.textContent = "タイピング中";
                    startTime = performance.now();
                    timerInterval = setInterval(updateTimer, 10);
                }
                
                currentIndex++;
                updateRomajiDisplay(true);
                
                if (currentIndex === targetWord.length) {
                    // ここでSEを再生（クリア）
                    clearInterval(timerInterval);
                    finalTime = (performance.now() - startTime) / 1000;
                    timerEl.textContent = `${finalTime.toFixed(3)}s`;
                    isCleared = true;
                    
                    targetEl.classList.add('hidden');
                    resultsEl.classList.remove('hidden');
                    registrationForm.classList.remove('hidden');
                    messageEl.textContent = "";

                    const rankResult = getRank(finalTime);
                    rankCharEl.textContent = rankResult.rank;
                    rankMsgEl.textContent = rankResult.message;
                    
                    rankCharEl.classList.remove('rank-animate');
                    void rankCharEl.offsetWidth;
                    rankCharEl.classList.add('rank-animate');
                }
            } else {
                if (currentIndex > 0) {
                    // ここでSEを再生（ミス）
                    resetGame(true);
                }
            }
        });

        document.getElementById('submit-score').addEventListener('click', async () => {
            const nameInput = document.getElementById('player-name');
            const name = nameInput.value.trim() || '名無し';
            
            registrationForm.classList.add('hidden');
            
            try {
                await addDoc(collection(db, "rankings"), {
                    name: name,
                    time: finalTime,
                    timestamp: serverTimestamp()
                });
                loadRankings();
            } catch (e) {
                console.error("Error adding document: ", e);
                alert("記録の保存に失敗しました。");
            }
        });

        updateRomajiDisplay();
    </script>
</body>
</html>
