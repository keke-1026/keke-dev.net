<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100;300&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #333333;
            --line-color: #cccccc;
            --hover-bg: #f5f5f5;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Noto Sans JP', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 100vh;
            padding-left: 12vw;
        }

        .container {
            max-width: 500px;
            width: 100%;
        }

        h1 {
            font-weight: 100;
            font-size: 5rem;
            margin: 0;
            letter-spacing: 0.05em;
        }

        p {
            font-weight: 300;
            margin: 5px 0 25px;
            font-size: 1.2rem;
            color: #666666;
        }

        .animated-line {
            height: 1px;
            background-color: var(--line-color);
            width: 0;
            margin-bottom: 30px;
            animation: drawLine 1s ease-out 0.2s forwards;
        }

        @keyframes drawLine {
            to {
                width: 100%;
            }
        }

        .portal-nav {
            list-style: none;
            padding: 0;
            margin: 0;
            opacity: 0;
            transform: translateY(10px);
            animation: fadeInUp 0.8s ease-out 0.8s forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .portal-nav li {
            margin-bottom: 10px;
        }

        .portal-nav a {
            display: inline-block;
            text-decoration: none;
            color: var(--text-color);
            font-weight: 300;
            font-size: 1.1rem;
            padding: 10px 16px;
            border-radius: 8px;
            transition: background-color 0.3s ease;
            margin-left: -16px;
        }

        .portal-nav a:hover {
            background-color: var(--hover-bg);
        }

        footer {
            margin-top: 50px;
            font-size: 0.8rem;
            color: #999999;
            font-weight: 100;
            user-select: none;
            opacity: 0;
            animation: fadeInUp 0.8s ease-out 1s forwards;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <p>Page Not Found</p>
        <div class="animated-line"></div>
        <ul id="portal-links" class="portal-nav">
        </ul>
        <footer id="copyright">
            &copy; 2026 keke-dev
        </footer>
    </div>

    <script src="https://cdn.ke2.jp/file/portal.js"></script>
</body>
</html>
